name: Deploy Backend to cPanel
on:
  push:
    branches:
      - main

jobs:
  FTP-Deploy-Action:
    name: FTP Deploy Action
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v4
      
    - name: Sync Backend Files
      uses: wlixcc/SFTP-Deploy-Action@v1.2.4
      with:
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server: ${{ secrets.FTP_SERVER }}
        port: 21
        protocol: ftp
        local_path: './backend/*'
        # ⚠️ Note the formatting change for this specific tool's directory path:
        remote_path: '/repositories/IMSolutions-Dashboard/backend'
        # Forces the action to ignore local connection quirks
        passive: true
