name: Deploy Backend to cPanel
on:
  push:
    branches:
      - main

jobs:
  FTP-Deploy:
    name: Node FTP Deploy
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-node-version: '20'

    - name: Install Deployment Helper
      run: npm install ftp-deploy

    - name: Run Deployment Script
      uses: actions/github-script@v7
      with:
        script: |
          const FtpDeploy = require('ftp-deploy');
          const ftpDeploy = new FtpDeploy();
          
          const config = {
              user: process.env.FTP_USERNAME,
              password: process.env.FTP_PASSWORD,
              host: process.env.FTP_SERVER,
              port: 21,
              localRoot: __dirname + '/backend',
              remoteRoot: '/repositories/IMSolutions-Dashboard/backend/',
              include: ['*', '**/*'],
              exclude: [],
              deleteRemote: false,
              forcePasv: true // Pure JS handles cPanel's custom PASV quirks safely
          };
          
          ftpDeploy.deploy(config)
              .then(res => console.log('Deployment successful:', res))
              .catch(err => {
                  console.error('Deployment failed:', err);
                  core.setFailed(err.message);
              });
      env:
        FTP_SERVER: ${{ secrets.FTP_SERVER }}
        FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
